[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mfdfa-multiverse"
version = "0.1.0"
description = "Specification-curve (multiverse) analysis for DFA/MFDFA pipelines on physiological time series"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Samir Hossain" }]
keywords = [
    "DFA", "MFDFA", "multifractal", "specification curve", "multiverse analysis",
    "heart rate variability", "reproducibility", "physiological complexity",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.9",
    "pandas>=1.5",
    "joblib>=1.2",
]

[project.optional-dependencies]
data = ["wfdb>=4.0", "requests>=2.28", "pyarrow>=10"]
plot = ["matplotlib>=3.6"]
dev = ["pytest>=7", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/SamirHossain099/mfdfa-multiverse"
Issues = "https://github.com/SamirHossain099/mfdfa-multiverse/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mfdfa_multiverse"]

[tool.ruff]
line-length = 100
target-version = "py310"
