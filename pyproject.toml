[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "specurve"
version = "0.1.0"
description = "Specification-curve (multiverse) analysis for DFA/MFDFA pipelines on physiological time series"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Samir Hossain" }]
keywords = [
    "DFA", "MFDFA", "multifractal", "specification curve", "multiverse analysis",
    "heart rate variability", "reproducibility", "physiological complexity",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.9",
    "pandas>=1.5",
    "joblib>=1.2",
]

[project.optional-dependencies]
data = ["wfdb>=4.0", "requests>=2.28", "pyarrow>=10"]
plot = ["matplotlib>=3.6"]
dev = ["pytest>=7", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/SamirHossain099/specurve"
Issues = "https://github.com/SamirHossain099/specurve/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/specurve"]

# Deny by default, exactly as .gitignore does, and for a sharper reason: hatchling does NOT read
# .gitignore, so without this the sdist swallowed the whole working directory. The first build
# was 135 MB unpacked and contained submission correspondence, a named reviewer list, project
# strategy, both manuscripts, 78 MB of intermediate grids and node_modules. A PyPI upload cannot
# be taken back, so the sdist ships the package and nothing else. The study, its data and its
# tests live in the repository and the Zenodo archive.
[tool.hatch.build.targets.sdist]
only-include = [
    "src/specurve",
    "README.md",
    "LICENSE",
    "CITATION.cff",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py310"
